      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/var/lib/flutter/bin:/app/bin:/run/build/keychat-app/.pub-cache/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/keychat-app/.pub-cache
    build-commands:
      - protoc --version
      - setup-flutter.sh -C .
      - cd ../keychat_ecash && flutter pub get --offline
      - cd ../keychat_rust_ffi_plugin && flutter pub get --offline
      - echo "a=123" > .env
      - flutter build linux --release --no-pub --verbose
      - install -D $BUNDLE_PATH/keychat /app/bin/keychat
      - cp -r $BUNDLE_PATH/lib /app/bin/lib
      - cp -r $BUNDLE_PATH/data /app/bin/data
    sources:
      - pubspec-sources.json
      - type: git
        url: https://github.com/keychat-io/keychat-app.git
        commit: 572612a8d33bc3b88c226c3e24d81a66f66dde7c
      - type: patch
        path: cargokit/run_build_tool.sh.patch
        dest: .pub-cache/hosted/pub.dev/super_native_extensions-0.9.1/cargokit
      - cargo-sources.json
    modules:
      - flutter-sdk-3.38.3.json
