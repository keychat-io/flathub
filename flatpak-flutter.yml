# Generated from flatpak-flutter.yml, do not edit
# Visit the flatpak-flutter project at https://github.com/TheAppgineer/flatpak-flutter
id: com.keychat.io
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: keychat
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=all
  - --socket=pulseaudio
  - --filesystem=home
modules:
  - name: protobuf-compiler
    buildsystem: cmake
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -Dprotobuf_BUILD_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/protocolbuffers/protobuf/releases/download/v33.1/protobuf-33.1.tar.gz
        sha256: fda132cb0c86400381c0af1fe98bd0f775cb566cb247cdcc105e344e00acc30e
  - name: keychat-app
    buildsystem: simple
    subdir: packages/app
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/var/lib/rustup/bin:/var/lib/flutter/bin:/app/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        cargo_HOME: /run/build/keychat-app/cargo
        RUSTUP_HOME: /var/lib/rustup
        PUB_CACHE: /run/build/keychat-app/.pub-cache
        PROTOC: /app/bin/protoc
    build-commands:
      - setup-flutter.sh -C .
      - cd ../keychat_ecash && flutter pub get --offline
      - cd ../keychat_rust_ffi_plugin && flutter pub get --offline
      - echo "a=123" > .env
      - flutter build linux --release --target-platform=linux-x64 --no-pub --verbose
      - install -D $BUNDLE_PATH/keychat /app/bin/keychat
      - cp -r $BUNDLE_PATH/lib /app/bin/lib
      - cp -r $BUNDLE_PATH/data /app/bin/data
    sources:
      - type: git
        url: https://github.com/keychat-io/keychat-app.git
        commit: 7556c1ae61fc328381f2f7d628ded03d3b3a93f9
        branch: flatapp
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.38.3
        dest: flutter
